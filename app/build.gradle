plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sriomkar.lockscreen'
    compileSdk 34

    defaultConfig {
        applicationId "com.sriomkar.lockscreen"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
